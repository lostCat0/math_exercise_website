<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">四则运算练习</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <h1 data-i18n="app.title">四则运算练习</h1>
                <p class="sub" data-i18n="app.subtitle">小学数学 · 在线做题、实时批改</p>
            </div>
            <button id="langBtn" class="btn ghost" type="button" data-i18n="lang.toggle">EN</button>
        </header>

        <nav class="tabs" role="tablist">
            <button class="tab active" type="button" data-tab="practice" role="tab" aria-selected="true"
                data-i18n="tab.practice">在线练习</button>
            <button class="tab" type="button" data-tab="worksheet" role="tab" aria-selected="false"
                data-i18n="tab.worksheet">打印练习卷</button>
        </nav>

        <section class="panel config-panel">
            <div class="panel-head">
                <h2 data-i18n="config.title">出题设置</h2>
                <div class="presets">
                    <button class="chip" type="button" data-preset="easy" data-i18n="preset.easy">简单</button>
                    <button class="chip" type="button" data-preset="medium" data-i18n="preset.medium">中等</button>
                    <button class="chip" type="button" data-preset="hard" data-i18n="preset.hard">困难</button>
                </div>
            </div>

            <div class="config-grid">
                <label>
                    <span data-i18n="config.count">题目数量</span>
                    <input type="number" id="count" value="10" min="1" max="2000" />
                </label>
                <label>
                    <span data-i18n="config.min">数值下限</span>
                    <input type="number" id="minNum" value="0" />
                </label>
                <label>
                    <span data-i18n="config.max">数值上限</span>
                    <input type="number" id="maxNum" value="100" />
                </label>
                <label>
                    <span data-i18n="config.perLine">每行题数</span>
                    <input type="number" id="perLine" value="2" min="1" max="5" />
                </label>
                <label>
                    <span data-i18n="config.blankLines">题间空行</span>
                    <input type="number" id="blankLines" value="1" min="0" max="5" />
                </label>

                <label class="checkbox">
                    <input type="checkbox" id="allowMulDiv" checked />
                    <span data-i18n="config.allowMulDiv">允许乘除法</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" id="allowParentheses" />
                    <span data-i18n="config.allowParentheses">允许括号</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" id="allowNegative" />
                    <span data-i18n="config.allowNegative">允许负数</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" id="allowRemainder" />
                    <span data-i18n="config.allowRemainder">允许余数</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" id="allowFraction" />
                    <span data-i18n="config.allowFraction">支持分数</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" id="printAnswer" />
                    <span data-i18n="config.printAnswer">打印答案</span>
                </label>
            </div>
        </section>

        <section id="viewPractice" class="view">
            <div class="toolbar">
                <div class="stats">
                    <div class="stat">
                        <span class="stat-k" data-i18n="practice.progress">进度</span>
                        <span class="stat-v" id="statProgress">0 / 0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-k" data-i18n="practice.correct">答对</span>
                        <span class="stat-v" id="statCorrect">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-k" data-i18n="practice.accuracy">准确率</span>
                        <span class="stat-v" id="statAccuracy">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-k" data-i18n="practice.time">用时</span>
                        <span class="stat-v" id="statTime">00:00</span>
                    </div>
                </div>
                <div class="toolbar-actions">
                    <button id="btnFinish" class="btn" type="button" data-i18n="btn.finish">结束并查看结果</button>
                    <button id="btnRestart" class="btn ghost" type="button" data-i18n="btn.newSet">再来一组</button>
                </div>
            </div>

            <div class="progress-track" role="presentation">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <p id="practiceEmpty" class="empty hidden" data-i18n="hint.none">未能生成任何题目，请放宽限制条件后重试。</p>
            <ol id="qList" class="q-list"></ol>

            <div id="resultPanel" class="panel result hidden"></div>
        </section>

        <section id="viewWorksheet" class="view hidden">
            <div class="toolbar">
                <p class="muted" data-i18n="worksheet.hint">生成后可打印成练习卷，打印时自动隐藏设置区与按钮。</p>
                <div class="toolbar-actions">
                    <button id="btnGenerate" class="btn" type="button" data-i18n="btn.regenerate">重新出题</button>
                    <button id="btnPrint" class="btn ghost" type="button" data-i18n="btn.print">打印</button>
                </div>
            </div>
            <div id="output" class="output panel"></div>
            <p id="hint" class="hint"></p>
        </section>

        <section class="panel history">
            <div class="panel-head">
                <h2 data-i18n="history.title">历史记录</h2>
                <button id="btnClearHistory" class="btn ghost small" type="button"
                    data-i18n="btn.clearHistory">清空历史</button>
            </div>
            <div id="historyStats" class="history-stats"></div>
            <div class="table-wrap">
                <table id="historyTable" class="history-table hidden">
                    <thead>
                        <tr>
                            <th data-i18n="history.date">时间</th>
                            <th data-i18n="history.count">题数</th>
                            <th data-i18n="history.correct">答对</th>
                            <th data-i18n="history.accuracy">准确率</th>
                            <th data-i18n="history.duration">用时</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
            <p id="historyEmpty" class="muted" data-i18n="history.empty">还没有练习记录，开始做第一组吧。</p>
        </section>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/core.js"></script>
    <script src="js/store.js"></script>
    <script src="js/practice.js"></script>
    <script src="js/worksheet.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
